CONFIG_LOG=y

# Provides base64_decode() (zephyr/sys/base64.h) used to decode the
# Anti-Spoofing key before importing it via PSA.
CONFIG_BASE64=y

# TF-M is pulled in automatically by the /ns board target, and it provides the
# PSA Crypto API to this non-secure image (psa/crypto.h).
#
# PSA features needed to import the Fast Pair Anti-Spoofing key (a SECP-R1
# ECDH key pair) into the CRACEN KMU. Without these, psa_import_key() of an
# ECC/ECDH key returns PSA_ERROR_NOT_SUPPORTED (-134).
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_ECDH=y
