# Sysbuild configuration for the "build_ns_boot" flavor:
#   /ns (TF-M) + MCUboot bootloader with DFU + runtime Fast Pair provisioner.
#
# Selected with:
#   west build -b nrf54l15dk/nrf54l15/cpuapp/ns -d build_ns_boot -- -DFILE_SUFFIX=boot
#
# This file is only read when FILE_SUFFIX=boot, so the plain (no-suffix) standard
# and /ns builds are completely unaffected.

# This sample describes its flash layout with devicetree partitions, not the
# Partition Manager.
SB_CONFIG_PARTITION_MANAGER=n

# MCUboot bootloader.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Overwrite-only upgrade mode. The secondary slot lives in the external SPI-NOR
# flash (see the boards/*_ns_boot.overlay), so direct-xip is not possible
# (external flash is not execute-in-place on nRF54L) and the "pure" signature
# type is unsupported with an external secondary slot. In overwrite-only mode
# MCUboot copies the update image from the external secondary slot into the
# internal primary slot before booting it.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# Hardware-accelerated Ed25519 image signature with the public key stored in the
# CRACEN KMU. The key is provisioned into the KMU by the west runner at flash
# time (see the README/provisioning notes), which requires `west flash --erase`
# or `--recover`.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${SB_APPLICATION_CONFIG_DIR}/sysbuild/boot_signature_key_file_ed25519.pem"
SB_CONFIG_MCUBOOT_GENERATE_DEFAULT_KEY_FILE=y
