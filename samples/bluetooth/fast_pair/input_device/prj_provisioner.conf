# FILE_SUFFIX=provisioner replaces prj.conf and builds provisioner_main.c, which
# calls provision_data(). CONFIG_PROVISIONER is set in sysbuild.cmake;
# subsys/provisioner/prj.conf is merged via add_overlay_config().

CONFIG_FP_PROVISION_DATA=y

CONFIG_SETTINGS=n

CONFIG_LOG=y
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MAIN_STACK_SIZE=4096