# FILE_SUFFIX=provisioner replaces prj.conf and builds provisioner_main.c, which
# calls provision_data(). CONFIG_PROVISIONER is also set in sysbuild.cmake.

CONFIG_PROVISIONER=y

CONFIG_FP_PROVISION_DATA=y

CONFIG_SETTINGS=n

CONFIG_LOG=y
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_PROVISIONER_SANITIZE_HEX=y