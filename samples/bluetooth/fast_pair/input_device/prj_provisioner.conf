# Application configuration for the Fast Pair provisioner source
# (APP_SOURCE=provisioner). Selected in CMakeLists.txt instead of prj.conf. The
# sources come from ../provisioner (see CMakeLists.txt). This is a minimal image
# without the Bluetooth/Fast Pair stack: it only imports the Anti-Spoofing key
# into the KMU and writes the Model ID to Internal Trusted Storage, then exits.

CONFIG_LOG=y

# Used to overwrite the embedded Anti-Spoofing key in RRAM after KMU import.
CONFIG_FLASH=y

# Provides base64_decode() used to decode the Anti-Spoofing key before importing
# it via PSA.
CONFIG_BASE64=y

# PSA features needed to import the Fast Pair Anti-Spoofing key (a SECP-R1 ECDH
# key pair) into the CRACEN KMU.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_ECDH=y

# Boot from the MCUboot-defined code partition.
CONFIG_USE_DT_CODE_PARTITION=y
