# Application configuration for the "build_ns_boot" flavor (selected with
# FILE_SUFFIX=boot). It replaces boards/nrf54l15dk_nrf54l15_cpuapp_ns.conf, so it
# repeats the base /ns settings and adds MCUboot/DFU on top. The common prj.conf
# still applies (there is no prj_boot.conf).

# --- Base /ns (TF-M) settings (kept in sync with nrf54l15dk_nrf54l15_cpuapp_ns.conf) ---
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3584

# Align the advertised TX power with Fast Pair expectations.
CONFIG_BT_ADV_PROV_TX_POWER_CORRECTION_VAL=-11

# Configure TF-M verbosity
CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=y

# Configure PSA crypto backend
CONFIG_BT_FAST_PAIR_CRYPTO_PSA=y

# Source the Fast Pair registration data from hardware-protected storage
# (KMU + Protected Storage) provisioned by the provisioner image.
CONFIG_BT_FAST_PAIR_PROVISION=y

# --- MCUboot (2-slot foundation) ---
# The application is booted by MCUboot and must be built as an MCUboot image.
# The two-slot layout (internal primary + external SPI-NOR secondary) is kept as
# the representative DFU foundation.
CONFIG_BOOTLOADER_MCUBOOT=y

# Flash map + external SPI-NOR driver so the application can see the internal
# primary and external secondary slots (image-0 / image-1).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR=n

# --- Bluetooth LE DFU transport: DISABLED (development / foundation stage) ---
# The MCUmgr SMP-over-BLE transport and image-management plumbing are turned off
# so this build has a minimal MCUboot bootloader with the 2-slot layout intact
# but no over-the-air update path. Re-enable the block below to restore BLE DFU:
#   CONFIG_ZCBOR=y
#   CONFIG_MCUMGR=y
#   CONFIG_MCUMGR_TRANSPORT_BT=y
#   CONFIG_MCUMGR_GRP_OS=y
#   CONFIG_MCUMGR_GRP_IMG=y
#   CONFIG_IMG_MANAGER=y
#   CONFIG_STREAM_FLASH=y
#   CONFIG_IMG_ERASE_PROGRESSIVELY=y
#   CONFIG_BT_L2CAP_TX_MTU=498
#   CONFIG_BT_BUF_ACL_RX_SIZE=502
#   CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
