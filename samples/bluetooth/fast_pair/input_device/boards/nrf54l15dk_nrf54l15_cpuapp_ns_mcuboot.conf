# Board configuration for the MCUboot-enabled /ns (TF-M) build
# (FILE_SUFFIX=mcuboot). Combines the /ns PSA provisioning settings from
# nrf54l15dk_nrf54l15_cpuapp_ns.conf with MCUboot-specific TF-M options.
# Applied to both the main application and the provisioner source
# (APP_SOURCE=provisioner) via sysbuild.cmake when needed.

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3584

# Align the advertised TX power with Fast Pair expectations.
CONFIG_BT_ADV_PROV_TX_POWER_CORRECTION_VAL=-11

# Configure PSA crypto backend and runtime PSA provisioning (replaces the legacy
# bt_fast_pair flash partition, which is absent from the MCUboot flash layout).
CONFIG_BT_FAST_PAIR_CRYPTO_PSA=y
CONFIG_BT_FAST_PAIR_PROVISION=y

# Configure TF-M verbosity
CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
