# Board configuration for the provisioner source (FILE_SUFFIX=provisioner).
# Selected automatically instead of nrf54l15dk_nrf54l15_cpuapp_ns.conf, so the
# Bluetooth/Fast Pair options from that file are not pulled into this minimal
# image. Only the TF-M verbosity settings are kept.

CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
