# MCUboot sysbuild settings
# Plain /ns builds without those suffixes omit this file.

# This sample describes its flash layout with devicetree partitions.
SB_CONFIG_PARTITION_MANAGER=n

# MCUboot bootloader. The application executes in place from internal RRAM: it
# runs directly from the primary slot, no copy-to-RAM.
#
# Swap-using-move mode: signed application images in primary/secondary slots.
# (Direct-XIP is not used because a TF-M /ns image is split into a secure and a
# non-secure partition; the alternate-slot variant would span both slots and
# exceed a single slot.)
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Hardware Ed25519 image signature with the public key stored in the CRACEN KMU.
# The key is provisioned by the west runner at flash time, hence `--erase`/`--recover`.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${SB_APPLICATION_CONFIG_DIR}/boot_signature_key_file_ed25519.pem"
SB_CONFIG_MCUBOOT_GENERATE_DEFAULT_KEY_FILE=y