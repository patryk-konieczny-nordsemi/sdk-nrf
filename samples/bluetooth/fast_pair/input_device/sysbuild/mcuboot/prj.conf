CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=10240

CONFIG_HW_STACK_PROTECTION=y

# The MCUboot secondary slot resides in the external SPI-NOR flash, so MCUboot
# needs the SPI NOR driver compiled in to read (and, in overwrite-only mode,
# copy) the update image into the internal primary slot.
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR=n

# The primary (448 KB) and external secondary slots span many 4 KB sectors; size
# MCUboot's sector bookkeeping accordingly (default is tuned for internal flash).
CONFIG_BOOT_MAX_IMG_SECTORS=256

# RRAMC self-region protection (CONFIG_NCS_MCUBOOT_DISABLE_SELF_RWX) is left
# disabled here: its protected region is capped at 31 KB on nRF54L15, but this
# MCUboot carries the SPI-NOR driver (needed to read the external secondary
# slot), which makes the boot image larger than that cap. Re-enable it only if
# MCUboot is trimmed back under the 31 KB protection limit.
CONFIG_NCS_MCUBOOT_DISABLE_SELF_RWX=n

CONFIG_ASSERT=n

# MCUboot logging + boot banner over UART, so the bootloader is observable on the
# console (image validation, slot selection, overwrite/copy progress). Minimal
# log mode keeps it synchronous and avoids needing a logging thread/timer.
CONFIG_BOOT_BANNER=y
CONFIG_NCS_BOOT_BANNER=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# Optimize memory usage
# CLOCK_CONTROL stays enabled so the UART console (used for the MCUboot log/banner
# above) can obtain its peripheral clock.
CONFIG_GPIO=n
CONFIG_I2C=n
CONFIG_KERNEL_MEM_POOL=n
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_COMMON_LIBC_CALLOC=n
CONFIG_COMMON_LIBC_REALLOCARRAY=n
CONFIG_NCS_SAMPLES_DEFAULTS=n
CONFIG_NO_RUNTIME_CHECKS=y
CONFIG_NRF_RTC_TIMER=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SYS_CLOCK_EXISTS=n

# nRF54L uses the GRTC as system timer; MCUboot runs without a system clock.
CONFIG_NRF_GRTC_TIMER=n
CONFIG_NRF_GRTC_START_SYSCOUNTER=n

# Error handling configuration
CONFIG_RESET_ON_FATAL_ERROR=y

# Activate LTO
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# activate boot banners
CONFIG_BOOT_BANNER=y
CONFIG_MCUBOOT_BOOT_BANNER=y
