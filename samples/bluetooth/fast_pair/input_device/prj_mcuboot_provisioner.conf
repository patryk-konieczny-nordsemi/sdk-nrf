# FILE_SUFFIX=mcuboot_provisioner replaces prj.conf. CONFIG_PROVISIONER is also
# set in sysbuild.cmake; keep it here so dependent Kconfig symbols exist when
# this file is merged.

CONFIG_PROVISIONER=y
CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_FP_PROVISION_DATA=y

CONFIG_SETTINGS=n

CONFIG_LOG=y
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_PROVISIONER_SANITIZE_HEX=y
CONFIG_PROVISIONER_SANITIZE_SLOT0_NS=n
CONFIG_PROVISIONER_SANITIZE_SLOT0_FULL=y
