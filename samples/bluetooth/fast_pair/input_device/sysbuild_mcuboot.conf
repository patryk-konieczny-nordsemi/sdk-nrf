# Sysbuild configuration for the "build_ns_mcuboot" flavor:
#   /ns (TF-M) + MCUboot bootloader, execute-in-place (Direct-XIP).
#
# Selected automatically when the build directory is named `build_ns_mcuboot`.
# The application source is chosen with FILE_SUFFIX (single project, shared config):
#   west build -b nrf54l15dk/nrf54l15/cpuapp/ns -d build_ns_mcuboot -- -DFILE_SUFFIX=provisioner
#   west build -b nrf54l15dk/nrf54l15/cpuapp/ns -d build_ns_mcuboot -- -DFILE_SUFFIX=app
#
# The standard `build` and `build_ns` directories are unaffected.

# This sample describes its flash layout with devicetree partitions.
SB_CONFIG_PARTITION_MANAGER=n

# MCUboot bootloader. The application executes in place from internal RRAM: it
# runs directly from the primary slot, no copy-to-RAM.
#
# Overwrite-only mode keeps this to a single application image that the nRF
# Connect SDK signs automatically - there is no image variant and no manual
# signing step. (Direct-XIP is not used because a TF-M /ns image is split into a
# secure and a non-secure partition; the alternate-slot variant would span both
# slots and exceed a single slot.)
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# Hardware Ed25519 image signature with the public key stored in the CRACEN KMU.
# The key is provisioned by the west runner at flash time, hence `--erase`/`--recover`.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${SB_APPLICATION_CONFIG_DIR}/sysbuild/boot_signature_key_file_ed25519.pem"
SB_CONFIG_MCUBOOT_GENERATE_DEFAULT_KEY_FILE=y
