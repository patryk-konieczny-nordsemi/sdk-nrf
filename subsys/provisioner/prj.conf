CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=4096

# Enable PSA crypto for secure key and data registration
CONFIG_PSA_CRYPTO=y

# Used to erase the provisionded data from non-secure memory
CONFIG_FLASH=y

# Provides base64_decode()
CONFIG_BASE64=y

